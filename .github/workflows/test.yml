name: Rodar Testes

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -e ".[dev]" flake8

      - name: Linter e Validação de Sintaxe (Step 1)
        run: |
          flake8 src tests
          python -m compileall -q src tests

      - name: Rodar Testes (Step 2)
        run: |
          pytest --cov=src --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=junit.xml

      # O SonarCloud só deve ser executado se:
      # 1. Não for disparado pelo Dependabot (que não possui acesso aos secrets de Actions)
      # 2. O evento for push (merge) OU um PR interno do próprio repositório (não fork externo)
      - name: Scanner do SonarCloud
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # 'sonar.qualitygate.wait=true' pausa a execução do step e consulta a API do SonarCloud
        # até a conclusão da análise. Se o Quality Gate for reprovado (cobertura insuficiente, bugs,
        # code smells), o scanner encerra com código de erro diferente de zero e quebra o CI na hora.
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

      - name: Notificação de SonarCloud ignorado (Fork ou Dependabot)
        if: >-
          github.actor == 'dependabot[bot]' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::notice title=SonarCloud Ignorado::O scan foi ignorado pois foi disparado pelo Dependabot ou originou-se de um fork externo sem acesso aos secrets de repositório."
