name: Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes com cobertura
        run: |
          pytest --cov=src --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=junit.xml

      - name: Corrige reports path para container SonarCloud
        run: |
          sed -i "s#<source>${GITHUB_WORKSPACE}</source>#<source>/github/workspace</source>#g" coverage.xml || true

      - name: Gerar metadados do PR / Execução
        run: |
          mkdir -p pr_metadata
          cat << 'EOF' > pr_metadata/metadata.json
          {
            "event_name": "${{ github.event_name }}",
            "pr_number": "${{ github.event.pull_request.number }}",
            "head_ref": "${{ github.event.pull_request.head.ref || github.ref_name }}",
            "head_repo": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "base_ref": "${{ github.event.pull_request.base.ref || github.ref_name }}"
          }
          EOF

      - name: Upload de artefatos de cobertura e metadados
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: test-coverage-artifacts
          path: |
            coverage.xml
            junit.xml
            pr_metadata/metadata.json
          retention-days: 1

      - name: Scanner do SonarCloud (Fallback local com secrets)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}

      - name: Notificação de SonarCloud desacoplado
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN ausente em fork público. Testes executados com sucesso e artefatos salvos para a esteira desacoplada."
